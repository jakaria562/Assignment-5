<!doctype html>
<html class=" bg-base-200">
  <head >
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Assaignment-5</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
      @theme {
        --color-clifford: #da373d;
      }
      *{
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body class="">
    <header>

        <div class="navbar bg-base-100 shadow-sm">
  <div class="flex-1 pl-10">
    <a class="btn btn-ghost text-xl"> <span class=" w-[30px]"><img src="assets/github-logo.png" alt=""></span>GitHub Issues Tracker</a>
  </div>
  <div class="flex gap-2">
   <div class="relative">
  <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-300"></i>

  <input
    id="search-input"
  type="text"
    type="text"
    placeholder="Search..."
    class="w-full pl-8 pr-3 py-2 border rounded-lg"/>
</div>
    <div class="dropdown dropdown-end">
      <div class=" pl-5 pr-30">
        <button class="btn btn-primary " id="search-btn">Search
    </div>
  </div>
</div>
      
    </header>
    <section class="min-h-screen max-w-5xl  bg-base-200 mx-auto mt-7">
          <div id="status-tabs" class="bg-white  shadow-sm pt-3 pb-3 pl-3">
   <button value="all" type="button" class="status-btn btn btn-primary">
        All
    </button>

   <button value="open" type="button" class="status-btn btn btn-soft">
        Open 
    </button>

    <button value="closed" type="button" class="status-btn btn btn-soft">
        Closed 
    </button>

</div>

     <div class="shadow-sm bg-base-200  px-4 py-3">

        <div class="flex items-center justify-between shadow  bg-white px-4 py-3 ">
    <div class="flex items-center gap-3">
      <div class="p-2 rounded-full bg-slate-200">
            <img src="assets/Aperture.png" alt="">
       </div>

        <div>
           <h3 class="text-sm font-semibold text-gray-900">
              <span id="total-issues">0</span> Issues
            </h3>
            <p class="text-[10px] text-gray-500">
             Track and manage your project issues
            </p>
        </div>
    </div>
    <div class="flex items-center gap-4 text-[10px]">
        <span class="flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-green-500"></span>
            Open
        </span>
        <span class="flex items-center gap-1">
           <span class="w-2 h-2 rounded-full bg-purple-500"></span>
        Closed
        </span>
    </div>

</div>
   <div id="loading" class="text-center py-10 hidden">
    <span class="loading loading-spinner text-info"></span>
</div>
    <div id="issues-container"class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 p-4">


</div>
    </section>
    <dialog id="issue_details" class="modal">

    <div class="modal-box">

        <div id="details-container">
        </div>

        <div class="modal-action">
         <form method="dialog">
              <button class="btn btn-primary">
        Close
          </button>
        </form>
        </div>

    </div>

</dialog>

    <script src="script/home.js"></script>
  </body>
</html>
